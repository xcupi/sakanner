# sakanner lab -- nginx profile (Docker Compose only).
#
# Serves the same fixtures the Go-native harness embeds
# (tests/lab/fixtures), so both profiles present identical content for
# scanner.test. Server tokens are left at nginx's real default (not
# faked) so this profile also validates fingerprinting against a real
# nginx Server header, which the Go-native harness cannot do since it
# has no actual nginx binary to ask.
worker_processes 1;
events { worker_connections 64; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name scanner.test www.scanner.test;
        root /usr/share/nginx/lab;

        location / {
            try_files /scanner-test-index.html =404;
        }
        location = /about {
            add_header Content-Type text/html;
            alias /usr/share/nginx/lab/generic-page.html;
        }
        location = /search {
            add_header Content-Type text/html;
            alias /usr/share/nginx/lab/generic-page.html;
        }
        location = /contact {
            add_header Content-Type text/html;
            alias /usr/share/nginx/lab/generic-page.html;
        }
        location = /static/app.js {
            add_header Content-Type application/javascript;
            alias /usr/share/nginx/lab/app.js;
        }
    }
}
