# sakanner lab -- Apache httpd profile (Docker Compose only).
#
# Serves the same fixtures the Go-native harness embeds
# (tests/lab/fixtures), renamed to /index.html and /users-42.json etc. so
# a plain DocumentRoot works without extra rewrite rules. Server tokens
# are left at httpd's real default so this profile also validates
# fingerprinting against a genuine Apache Server header.
ServerRoot "/usr/local/apache2"
Listen 80
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so

DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
    Require all granted
    DirectoryIndex api-index.html
</Directory>

TypesConfig conf/mime.types
ErrorLog /proc/self/fd/2
LogLevel warn
