    expected_result: no_vulnerability
    expected_behavior: "GET /api/ping/generic?host=<any> always returns the identical '{\"status\":\"ok\"}' regardless of host or injection representation -- never reflects or executes anything"
  - id: VULN-CMDI-API-STATICMARKER-NEG-001
