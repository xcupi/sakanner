    isolation_note: "the fixture itself refuses any destination outside 127.0.0.0/8 (a lab safety net, not part of the vulnerability's own logic) -- see docs/phase-3-test-lab.md 'SSRF fixture isolation'"
  # Phase 3.25 addition: a genuinely vulnerable endpoint whose response
  # NEVER reveals fetch outcome (the fetch happens in a goroutine,
  # modeling an async/queued job) -- the only meaningful proof
  # available is out-of-band callback correlation, which the
  # PRE-EXISTING ssrf detector's own callback-confirmed tier already
  # correctly picks up (it needs no knowledge of internal/detectors/ssrfactive
