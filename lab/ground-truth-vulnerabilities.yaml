    vulnerability_class: ssrf
    host: vuln.scanner.test
    endpoint: /ssrf/vulnerable-blind
    method: GET
    parameter: url
    severity: critical
    severity_rationale: "server-side request forgery, blind/OOB only -- the response never reveals fetch outcome regardless of success or failure, so callback correlation is the only evidence a detector can ever rely on for this specific endpoint"
    authentication_required: false
    automatically_detectable: true
    detector_category: ssrf-detector
    expected_evidence:
      description: "the fixture's own server-side process fetches the caller-supplied URL in a goroutine, but the HTTP response is always \"202 queued\" regardless of outcome -- only an out-of-band callback observation proves the fetch occurred"
    expected_behavior: "GET /ssrf/vulnerable-blind?url=<callback> always returns 202 \"queued\"; the callback service still records a real hit shortly afterward"
    isolation_note: "the fixture itself refuses any destination outside 127.0.0.0/8 (a lab safety net, not part of the vulnerability's own logic) -- see docs/phase-3-test-lab.md 'SSRF fixture isolation'"
  - id: VULN-SSRF-NEG-001
