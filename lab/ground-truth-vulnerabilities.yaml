# --- Scope enforcement scenarios (extends the Phase 2 lab's own) -----------------
#
# These are not findings -- they document how the vulnerable fixtures
# specifically exercise scope enforcement, on top of what
# lab/ground-truth.yaml (Phase 2) already covers.
scope_enforcement_scenarios:
  - description: "vuln.scanner.test's index page links directly to the established Phase 2 out-of-scope host"
    mechanism: crawler_link
    reference_host: external.scanner.test
    expected_behavior: "the crawler never follows this link (same-origin restriction, unchanged from Phase 2); no Asset/Host row for external.scanner.test after a scan"
  - description: "the open-redirect vulnerability's own natural exploitation path points at an out-of-scope host"
    mechanism: http_redirect
    reference_host: external.scanner.test
    fixture: /redirect/open/vulnerable?next=http://external.scanner.test/
    expected_behavior: "safedial's CheckRedirect truncates the chain at this hop (unchanged from Phase 2's own redirect-to-out-of-scope test); sakanner never dials external.scanner.test"
  - description: "the SSRF fixture's own vulnerability surface could in principle be pointed at an out-of-scope-looking destination"
    mechanism: ssrf_parameter
    reference_host: external.scanner.test
    expected_behavior: "this is a property of the FIXTURE APPLICATION's own request (made by vuln.scanner.test's server-side process), not of sakanner's dialing -- sakanner's scope enforcement governs what SAKANNER dials, which is unaffected either way. The fixture's own 127.0.0.0/8-only safety net (see the SSRF finding above) means even the fixture itself could not reach external.scanner.test's real address if asked to, independent of sakanner entirely. See docs/phase-3-test-lab.md 'SSRF fixture isolation' for the full reasoning."

# --- Authentication/authorization coverage summary -------------------------------
#
# Documents which findings above specifically exercise each of the four
# scenarios requested: unauthenticated access, authenticated access,
# unauthorized access, horizontal authorization failure.
authentication_coverage:
  unauthenticated_access:
    - VULN-EXPOSED-ADMIN-001 # reachable with no credentials at all
  authenticated_access_required_and_enforced:
    - VULN-EXPOSED-ADMIN-NEG-001 # correctly requires a bearer token
  unauthorized_access_correctly_denied:
    - VULN-IDOR-NEG-001 # a valid session for the WRONG user is correctly denied
  horizontal_authorization_failure:
    - VULN-IDOR-001 # a valid session for user A can read user B's data
