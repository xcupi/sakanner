# sakanner lab -- DNS zone for the Docker Compose profile (dnsmasq).
#
# Mirrors tests/lab/ground-truth.yaml's dns: section exactly -- keep
# these in sync if you change one. Unlike the Go-native harness (which
# answers on whatever port net.Listen picks and is driven entirely
# in-process), this profile runs a real DNS server so `scanner` itself
# can point its --config dns resolver at 127.0.0.1:15353 (see
# docker-compose.yml) without touching the host's /etc/hosts or
# /etc/resolv.conf.
no-resolv
no-hosts
port=53
bind-interfaces
listen-address=0.0.0.0

# www.scanner.test and admin.scanner.test are conceptually CNAMEs (see
# ground-truth.yaml), but are configured here as plain address= records
# resolving directly to their target's IP, NOT via dnsmasq's cname=
# directive. This was a deliberate finding, not an oversight: a live
# test of this exact config (dnsmasq 2.92, --no-resolv, run directly on
# this development machine outside Docker, queried with both `dig` and
# Go's own net.Resolver) found that dnsmasq answers a cname= lookup with
# ONLY the CNAME record -- no A record chained into the same response --
# and that at least one real client (Go's net.Resolver, including with
# PreferGo forced) did not reliably follow that CNAME to a final address
# through this server. Plain address= entries resolve correctly for
# every client tested. See docs/phase-2-test-lab.md "Known limitations"
# for the full writeup; this is a Docker-profile-only concern -- the
# Go-native harness (harness.go) sidesteps it entirely by populating
# dns.FakeResolver's Hosts and CNAMEs maps independently, never relying
# on live CNAME chasing.
address=/scanner.test/127.0.0.11
address=/www.scanner.test/127.0.0.11
address=/api.scanner.test/127.0.0.12
address=/static.scanner.test/127.0.0.13
address=/redirect.scanner.test/127.0.0.14
address=/js.scanner.test/127.0.0.15
address=/slow.scanner.test/127.0.0.16
address=/refuse.scanner.test/127.0.0.17
address=/altport.scanner.test/127.0.0.18

address=/admin.scanner.test/203.0.113.99
address=/external.scanner.test/203.0.113.99
address=/another-test.local/203.0.113.98
